<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting TikTok… — CLIPZIDA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0b; color: #fff; line-height: 1.6;
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .card { text-align: center; padding: 40px; }
        .logo { font-size: 2rem; font-weight: 900; letter-spacing: -1px;
                background: linear-gradient(135deg, #ff6b6b, #ffd93d);
                -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h1 { font-size: 1.2rem; margin: 20px 0 10px; }
        p { color: #a1a1aa; font-size: 0.95rem; }
        .err { color: #f87171; }
        a { color: #ff6b6b; }
        .spinner { display: inline-block; width: 28px; height: 28px;
                   border: 3px solid #27272a; border-top-color: #ff6b6b;
                   border-radius: 50%; animation: spin 0.8s linear infinite;
                   margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">CLIPZIDA</div>
        <div class="spinner"></div>
        <h1>Authorization received</h1>
        <p>Connecting you to the posting screen…</p>
        <p id="fallback" style="display:none; margin-top:16px">
            <span class="err">Redirect failed.</span>
            <a id="manuallink">Continue manually</a>
        </p>
    </div>
    <script>
        (function () {
            var qs = window.location.search; // preserves ?code=...&state=...
            var target = "https://169.58.182.213.sslip.io/callback/tiktok" + qs;
            var link = document.getElementById("manuallink");
            link.href = target;
            setTimeout(function () {
                try { window.location.replace(target); } catch (e) {
                    document.getElementById("fallback").style.display = "block";
                }
            }, 400);
            // If still here after 3s, the redirect didn't happen
            setTimeout(function () {
                if (!document.hidden) document.getElementById("fallback").style.display = "block";
            }, 3000);
        })();
    </script>
</body>
</html>

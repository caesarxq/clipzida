[project]
name = "clipping-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.4",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pydantic>=2.14.4",
    "pyyaml>=6.0",
    "typer>=0.29.2",
    "yt-dlp>=2026.1",
]

[project.scripts]
clipping-tools = "clipping_tools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipping_tools"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
